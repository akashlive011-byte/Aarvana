<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Aarvana Admin - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .login-card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);padding:40px;width:100%;max-width:400px}
        .input-field{width:100%;padding:12px 16px;border:2px solid #e5e5e5;border-radius:10px;font-size:14px;transition:border-color 0.2s}
        .input-field:focus{outline:none;border-color:#1a1a1a}
        .btn-primary{width:100%;padding:14px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.2s}
        .btn-primary:hover{background:#000}
        .error-msg{color:#ef4444;font-size:12px;margin-top:4px;display:none}
        .error-msg.show{display:block}
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900 tracking-wider">AARVANA</h1>
            <p class="text-gray-400 text-xs tracking-widest mt-1">ADMIN PANEL</p>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" class="input-field" placeholder="Enter username" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="input-field" placeholder="Enter password" required>
            </div>
            <p id="loginError" class="error-msg">Invalid credentials</p>
            <button type="submit" class="btn-primary mt-4">Sign In</button>
        </form>
    </div>
    <script>
        var ADMIN_CREDENTIALS = { username: 'admin', password: 'aarvana2026' };
        function handleLogin(e) {
            e.preventDefault();
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value.trim();
            if (u === ADMIN_CREDENTIALS.username && p === ADMIN_CREDENTIALS.password) {
                localStorage.setItem('aarvana_admin_logged_in', 'true');
                localStorage.setItem('aarvana_admin_user', u);
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('loginError').classList.add('show');
            }
        }
        if (localStorage.getItem('aarvana_admin_logged_in') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
