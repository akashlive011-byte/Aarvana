<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Aarvana Admin - Discounts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f5f5f5;display:flex;min-height:100vh}
        .sidebar{width:260px;background:#1a1a1a;color:#fff;padding:20px 0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.3s}
        .sidebar.collapsed{transform:translateX(-260px)}
        .sidebar-logo{padding:0 20px 20px;border-bottom:1px solid #333;margin-bottom:20px}
        .sidebar-logo h2{font-size:20px;font-weight:700;letter-spacing:2px}
        .nav-item{display:flex;align-items:center;padding:12px 20px;color:#aaa;text-decoration:none;font-size:13px;transition:all 0.2s}
        .nav-item:hover,.nav-item.active{background:rgba(255,255,255,0.05);color:#fff;border-left:3px solid #D4AF37}
        .nav-item i{width:20px;margin-right:12px;text-align:center}
        .main-content{flex:1;margin-left:260px;padding:24px;transition:margin-left 0.3s}
        .main-content.expanded{margin-left:0}
        .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
        .menu-toggle{background:none;border:none;font-size:20px;cursor:pointer;color:#333;padding:8px}
        .card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.04);margin-bottom:20px}
        .card h3{font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eee}
        .btn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s}
        .btn-primary{background:#1a1a1a;color:#fff}.btn-primary:hover{background:#000}
        .btn-outline{background:#fff;color:#1a1a1a;border:2px solid #ddd}.btn-outline:hover{border-color:#1a1a1a}
        .btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
        .btn-sm{padding:6px 12px;font-size:11px}
        .input-field{width:100%;padding:10px 14px;border:2px solid #e5e5e5;border-radius:8px;font-size:13px;margin-bottom:12px}
        .input-field:focus{outline:none;border-color:#1a1a1a}
        .badge{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600}
        .badge-active{background:#d4edda;color:#155724}
        .badge-expired{background:#f8d7da;color:#721c24}
        .badge-scheduled{background:#fff3cd;color:#856404}
        .table-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .table-card th{background:#fafafa;padding:10px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;border-bottom:1px solid #eee}
        .table-card td{padding:10px 14px;font-size:13px;border-bottom:1px solid #f5f5f5}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center}
        .modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
        @media(max-width:768px){.sidebar{transform:translateX(-260px)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0}.grid-2,.grid-3{grid-template-columns:1fr}}
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><h2>AARVANA</h2><p>ADMIN PANEL</p></div>
        <nav>
            <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="orders.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="products.html" class="nav-item"><i class="fas fa-box"></i> Products</a>
            <a href="customers.html" class="nav-item"><i class="fas fa-users"></i> Customers</a>
            <a href="inventory.html" class="nav-item"><i class="fas fa-warehouse"></i> Inventory</a>
            <a href="tracking.html" class="nav-item"><i class="fas fa-truck"></i> Tracking</a>
            <a href="discount.html" class="nav-item active"><i class="fas fa-tags"></i> Discounts</a>
            <a href="refund.html" class="nav-item"><i class="fas fa-undo"></i> Refunds</a>
            <a href="analytics.html" class="nav-item"><i class="fas fa-chart-bar"></i> Analytics</a>
            <a href="offers.html" class="nav-item"><i class="fas fa-bullhorn"></i> Offers</a>
            <a href="staff.html" class="nav-item"><i class="fas fa-user-shield"></i> Staff</a>
            <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
            <div style="border-top:1px solid #333;margin:10px 0"></div>
            <a href="#" class="nav-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <button class="btn btn-primary" onclick="openAddCoupon()"><i class="fas fa-plus mr-1"></i> Add Coupon</button>
        </div>

        <!-- Stats Row -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="card"><p class="text-xs text-gray-400 uppercase">Active Coupons</p><p class="text-2xl font-bold" id="activeCount">0</p></div>
            <div class="card"><p class="text-xs text-gray-400 uppercase">Total Used</p><p class="text-2xl font-bold" id="totalUsed">0</p></div>
            <div class="card"><p class="text-xs text-gray-400 uppercase">Total Discount Given</p><p class="text-2xl font-bold" id="totalDiscount">$0</p></div>
        </div>

        <!-- Coupons Table -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Type</th>
                        <th>Value</th>
                        <th>Min Order</th>
                        <th>Max Discount</th>
                        <th>Used/Limit</th>
                        <th>Valid Until</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="couponsTable">
                    <tr><td colspan="9" class="text-center text-gray-400 py-8">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit Coupon Modal -->
    <div id="couponModal" class="modal-overlay" style="display:none">
        <div class="modal">
            <h3 id="modalTitle">Add Coupon</h3>
            <form id="couponForm" onsubmit="saveCoupon(event)">
                <input type="hidden" id="couponId">
                <input type="text" id="couponCode" class="input-field" placeholder="Coupon Code (e.g., SAVE20)" required>
                <select id="couponType" class="input-field" required>
                    <option value="">Select Type</option>
                    <option value="percentage">Percentage (%)</option>
                    <option value="fixed">Fixed Amount ($)</option>
                </select>
                <input type="number" id="couponValue" class="input-field" placeholder="Discount Value" step="0.01" required>
                <input type="number" id="couponMinOrder" class="input-field" placeholder="Minimum Order Amount (optional)" step="0.01">
                <input type="number" id="couponMaxDiscount" class="input-field" placeholder="Maximum Discount Cap (optional)" step="0.01">
                <div class="grid-2">
                    <input type="number" id="couponUsageLimit" class="input-field" placeholder="Usage Limit (optional)">
                    <input type="number" id="couponPerCustomer" class="input-field" placeholder="Per Customer Limit (optional)">
                </div>
                <input type="date" id="couponExpiry" class="input-field" required>
                <div class="flex gap-2">
                    <button type="submit" class="btn btn-primary flex-1">Save</button>
                    <button type="button" class="btn btn-outline flex-1" onclick="closeCouponModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        if (localStorage.getItem('aarvana_admin_logged_in') !== 'true') { window.location.href = 'login.html'; }
        
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); document.getElementById('mainContent').classList.toggle('expanded'); }
        function handleLogout() { localStorage.removeItem('aarvana_admin_logged_in'); window.location.href = 'login.html'; }
        
        var coupons = JSON.parse(localStorage.getItem('aarvana_coupons') || '[]');
        
        function loadCoupons() {
            var active = 0, used = 0, discount = 0;
            var now = new Date();
            
            for (var i = 0; i < coupons.length; i++) {
                if (coupons[i].status === 'active' && new Date(coupons[i].expiryDate) > now) active++;
                used += (coupons[i].usedCount || 0);
                discount += (coupons[i].totalDiscount || 0);
            }
            
            document.getElementById('activeCount').textContent = active;
            document.getElementById('totalUsed').textContent = used;
            document.getElementById('totalDiscount').textContent = '$' + discount.toFixed(2);
            
            var tbody = document.getElementById('couponsTable');
            if (coupons.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center text-gray-400 py-8">No coupons found</td></tr>';
                return;
            }
            
            var html = '';
            for (var i = 0; i < coupons.length; i++) {
                var c = coupons[i];
                var isExpired = new Date(c.expiryDate) < new Date();
                var statusClass = isExpired ? 'badge-expired' : (c.status === 'active' ? 'badge-active' : 'badge-scheduled');
                var statusText = isExpired ? 'Expired' : (c.status === 'active' ? 'Active' : 'Scheduled');
                
                html += '<tr>' +
                    '<td class="font-medium font-mono">' + c.code + '</td>' +
                    '<td>' + (c.type === 'percentage' ? 'Percentage' : 'Fixed Amount') + '</td>' +
                    '<td>' + (c.type === 'percentage' ? c.value + '%' : '$' + c.value) + '</td>' +
                    '<td>' + (c.minOrder ? '$' + c.minOrder : '-') + '</td>' +
                    '<td>' + (c.maxDiscount ? '$' + c.maxDiscount : '-') + '</td>' +
                    '<td>' + (c.usedCount || 0) + '/' + (c.usageLimit || '∞') + '</td>' +
                    '<td class="text-xs">' + new Date(c.expiryDate).toLocaleDateString() + '</td>' +
                    '<td><span class="badge ' + statusClass + '">' + statusText + '</span></td>' +
                    '<td>' +
                        '<button class="btn btn-outline btn-sm mr-1" onclick="editCoupon(\'' + c.id + '\')"><i class="fas fa-edit"></i></button>' +
                        '<button class="btn btn-danger btn-sm" onclick="deleteCoupon(\'' + c.id + '\')"><i class="fas fa-trash"></i></button>' +
                    '</td>' +
                '</tr>';
            }
            tbody.innerHTML = html;
        }
        
        function openAddCoupon() {
            document.getElementById('modalTitle').textContent = 'Add Coupon';
            document.getElementById('couponForm').reset();
            document.getElementById('couponId').value = '';
            document.getElementById('couponModal').style.display = 'flex';
        }
        
        function editCoupon(id) {
            var c = null;
            for (var i = 0; i < coupons.length; i++) { if (coupons[i].id === id) { c = coupons[i]; break; } }
            if (!c) return;
            document.getElementById('modalTitle').textContent = 'Edit Coupon';
            document.getElementById('couponId').value = c.id;
            document.getElementById('couponCode').value = c.code;
            document.getElementById('couponType').value = c.type;
            document.getElementById('couponValue').value = c.value;
            document.getElementById('couponMinOrder').value = c.minOrder || '';
            document.getElementById('couponMaxDiscount').value = c.maxDiscount || '';
            document.getElementById('couponUsageLimit').value = c.usageLimit || '';
            document.getElementById('couponPerCustomer').value = c.perCustomer || '';
            document.getElementById('couponExpiry').value = c.expiryDate ? c.expiryDate.split('T')[0] : '';
            document.getElementById('couponModal').style.display = 'flex';
        }
        
        function closeCouponModal() { document.getElementById('couponModal').style.display = 'none'; }
        
        function saveCoupon(e) {
            e.preventDefault();
            var id = document.getElementById('couponId').value;
            var data = {
                code: document.getElementById('couponCode').value.toUpperCase(),
                type: document.getElementById('couponType').value,
                value: parseFloat(document.getElementById('couponValue').value) || 0,
                minOrder: document.getElementById('couponMinOrder').value ? parseFloat(document.getElementById('couponMinOrder').value) : null,
                maxDiscount: document.getElementById('couponMaxDiscount').value ? parseFloat(document.getElementById('couponMaxDiscount').value) : null,
                usageLimit: document.getElementById('couponUsageLimit').value ? parseInt(document.getElementById('couponUsageLimit').value) : null,
                perCustomer: document.getElementById('couponPerCustomer').value ? parseInt(document.getElementById('couponPerCustomer').value) : null,
                expiryDate: document.getElementById('couponExpiry').value,
                status: 'active'
            };
            
            if (id) {
                for (var i = 0; i < coupons.length; i++) {
                    if (coupons[i].id === id) {
                        coupons[i] = Object.assign({}, coupons[i], data, {id: id, updatedAt: new Date().toISOString()});
                        break;
                    }
                }
            } else {
                data.id = 'CPN-' + Date.now().toString(36).toUpperCase();
                data.usedCount = 0;
                data.totalDiscount = 0;
                data.createdAt = new Date().toISOString();
                coupons.push(data);
            }
            
            localStorage.setItem('aarvana_coupons', JSON.stringify(coupons));
            closeCouponModal();
            loadCoupons();
        }
        
        function deleteCoupon(id) {
            if (!confirm('Delete this coupon?')) return;
            coupons = coupons.filter(function(c){return c.id !== id});
            localStorage.setItem('aarvana_coupons', JSON.stringify(coupons));
            loadCoupons();
        }
        
        document.addEventListener('DOMContentLoaded', loadCoupons);
    </script>
</body>
</html>
