<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Aarvana Admin - Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f5f5f5;display:flex;min-height:100vh}
        .sidebar{width:260px;background:#1a1a1a;color:#fff;padding:20px 0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.3s}
        .sidebar.collapsed{transform:translateX(-260px)}
        .sidebar-logo{padding:0 20px 20px;border-bottom:1px solid #333;margin-bottom:20px}
        .sidebar-logo h2{font-size:20px;font-weight:700;letter-spacing:2px}
        .nav-item{display:flex;align-items:center;padding:12px 20px;color:#aaa;text-decoration:none;font-size:13px;transition:all 0.2s}
        .nav-item:hover,.nav-item.active{background:rgba(255,255,255,0.05);color:#fff;border-left:3px solid #D4AF37}
        .nav-item i{width:20px;margin-right:12px;text-align:center}
        .main-content{flex:1;margin-left:260px;padding:24px;transition:margin-left 0.3s}
        .main-content.expanded{margin-left:0}
        .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
        .menu-toggle{background:none;border:none;font-size:20px;cursor:pointer;color:#333;padding:8px}
        .table-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .table-card th{background:#fafafa;padding:10px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;border-bottom:1px solid #eee}
        .table-card td{padding:10px 14px;font-size:13px;border-bottom:1px solid #f5f5f5}
        .status-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
        .status-confirmed{background:#d4edda;color:#155724}.status-pending{background:#fff3cd;color:#856404}
        .status-shipped{background:#cce5ff;color:#004085}.status-delivered{background:#d4edda;color:#155724}
        .status-cancelled{background:#f8d7da;color:#721c24}
        .btn{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s}
        .btn-outline{background:#fff;color:#1a1a1a;border:1px solid #ddd}.btn-outline:hover{border-color:#1a1a1a}
        .btn-primary{background:#1a1a1a;color:#fff}.btn-primary:hover{background:#000}
        .input-field{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:12px}
        .input-field:focus{outline:none;border-color:#1a1a1a}
        @media(max-width:768px){.sidebar{transform:translateX(-260px)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0}}
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><h2>AARVANA</h2><p>ADMIN PANEL</p></div>
        <nav>
            <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="orders.html" class="nav-item active"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="products.html" class="nav-item"><i class="fas fa-box"></i> Products</a>
            <a href="customers.html" class="nav-item"><i class="fas fa-users"></i> Customers</a>
            <a href="inventory.html" class="nav-item"><i class="fas fa-warehouse"></i> Inventory</a>
            <a href="tracking.html" class="nav-item"><i class="fas fa-truck"></i> Tracking</a>
            <a href="discount.html" class="nav-item"><i class="fas fa-tags"></i> Discounts</a>
            <a href="refund.html" class="nav-item"><i class="fas fa-undo"></i> Refunds</a>
            <a href="analytics.html" class="nav-item"><i class="fas fa-chart-bar"></i> Analytics</a>
            <a href="offers.html" class="nav-item"><i class="fas fa-bullhorn"></i> Offers</a>
            <a href="staff.html" class="nav-item"><i class="fas fa-user-shield"></i> Staff</a>
            <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
            <div style="border-top:1px solid #333;margin:10px 0"></div>
            <a href="#" class="nav-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="flex items-center gap-3">
                <input type="text" id="searchOrder" class="input-field" placeholder="Search by Order ID or Phone..." oninput="filterOrders()">
                <select id="statusFilter" class="input-field" onchange="filterOrders()">
                    <option value="all">All Status</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Processing">Processing</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTable">
                    <tr><td colspan="9" class="text-center text-gray-400 py-8">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/admin.js"></script>
    <script>
        if (localStorage.getItem('aarvana_admin_logged_in') !== 'true') { window.location.href = 'login.html'; }
        
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); document.getElementById('mainContent').classList.toggle('expanded'); }
        function handleLogout() { localStorage.removeItem('aarvana_admin_logged_in'); window.location.href = 'login.html'; }
        
        var allOrders = [];
        
        function loadOrders() {
            allOrders = JSON.parse(localStorage.getItem('aarvana_orders') || '[]');
            renderOrders(allOrders);
        }
        
        function renderOrders(orders) {
            var tbody = document.getElementById('ordersTable');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center text-gray-400 py-8">No orders found</td></tr>';
                return;
            }
            var html = '';
            for (var i = 0; i < orders.length; i++) {
                var o = orders[i];
                var statusClass = 'status-confirmed';
                if (o.status === 'Processing') statusClass = 'status-pending';
                if (o.status === 'Shipped') statusClass = 'status-shipped';
                if (o.status === 'Delivered') statusClass = 'status-delivered';
                if (o.status === 'Cancelled') statusClass = 'status-cancelled';
                
                html += '<tr>' +
                    '<td class="font-medium">' + o.orderNumber + '</td>' +
                    '<td>' + (o.customer ? o.customer.name : 'N/A') + '</td>' +
                    '<td>' + (o.customer ? o.customer.phone : 'N/A') + '</td>' +
                    '<td>' + o.items.length + '</td>' +
                    '<td>$' + (o.total || 0).toFixed(2) + '</td>' +
                    '<td>' + (o.payment ? o.payment.method.toUpperCase() : 'N/A') + '</td>' +
                    '<td>' +
                        '<select class="input-field" onchange="updateStatus(\'' + o.orderNumber + '\', this.value)" style="width:120px">' +
                            '<option value="Confirmed" ' + (o.status === 'Confirmed' ? 'selected' : '') + '>Confirmed</option>' +
                            '<option value="Processing" ' + (o.status === 'Processing' ? 'selected' : '') + '>Processing</option>' +
                            '<option value="Shipped" ' + (o.status === 'Shipped' ? 'selected' : '') + '>Shipped</option>' +
                            '<option value="Delivered" ' + (o.status === 'Delivered' ? 'selected' : '') + '>Delivered</option>' +
                            '<option value="Cancelled" ' + (o.status === 'Cancelled' ? 'selected' : '') + '>Cancelled</option>' +
                        '</select>' +
                    '</td>' +
                    '<td class="text-gray-500 text-xs">' + new Date(o.date).toLocaleDateString() + '</td>' +
                    '<td><button class="btn btn-outline" onclick="viewOrder(\'' + o.orderNumber + '\')"><i class="fas fa-eye"></i></button></td>' +
                '</tr>';
            }
            tbody.innerHTML = html;
        }
        
        function updateStatus(orderNumber, newStatus) {
            for (var i = 0; i < allOrders.length; i++) {
                if (allOrders[i].orderNumber === orderNumber) {
                    allOrders[i].status = newStatus;
                    break;
                }
            }
            localStorage.setItem('aarvana_orders', JSON.stringify(allOrders));
        }
        
        function filterOrders() {
            var search = document.getElementById('searchOrder').value.toLowerCase();
            var status = document.getElementById('statusFilter').value;
            var filtered = allOrders.filter(function(o) {
                var matchSearch = !search || 
                    o.orderNumber.toLowerCase().indexOf(search) !== -1 ||
                    (o.customer && o.customer.phone && o.customer.phone.indexOf(search) !== -1) ||
                    (o.customer && o.customer.name && o.customer.name.toLowerCase().indexOf(search) !== -1);
                var matchStatus = status === 'all' || o.status === status;
                return matchSearch && matchStatus;
            });
            renderOrders(filtered);
        }
        
        function viewOrder(orderNumber) {
            var order = null;
            for (var i = 0; i < allOrders.length; i++) {
                if (allOrders[i].orderNumber === orderNumber) { order = allOrders[i]; break; }
            }
            if (!order) return;
            
            var details = 'Order: ' + order.orderNumber + '\n';
            details += 'Date: ' + new Date(order.date).toLocaleString() + '\n';
            details += 'Customer: ' + (order.customer ? order.customer.name : 'N/A') + '\n';
            details += 'Phone: ' + (order.customer ? order.customer.phone : 'N/A') + '\n';
            details += 'Address: ' + (order.customer ? [order.customer.address, order.customer.upazila, order.customer.district, order.customer.division].filter(Boolean).join(', ') : 'N/A') + '\n';
            details += 'Payment: ' + (order.payment ? order.payment.method.toUpperCase() : 'N/A') + '\n';
            details += 'Status: ' + order.status + '\n\n';
            details += 'ITEMS:\n';
            for (var i = 0; i < order.items.length; i++) {
                details += '- ' + order.items[i].name + ' x' + order.items[i].quantity + ' = $' + (order.items[i].price * order.items[i].quantity).toFixed(2) + '\n';
            }
            details += '\nSubtotal: $' + order.subtotal.toFixed(2) + '\n';
            details += 'Shipping: $' + order.shipping.toFixed(2) + '\n';
            details += 'Total: $' + order.total.toFixed(2);
            
            alert(details);
        }
        
        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
