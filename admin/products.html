<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Aarvana Admin - Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f5f5f5;display:flex;min-height:100vh}
        .sidebar{width:260px;background:#1a1a1a;color:#fff;padding:20px 0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.3s}
        .sidebar.collapsed{transform:translateX(-260px)}
        .sidebar-logo{padding:0 20px 20px;border-bottom:1px solid #333;margin-bottom:20px}
        .sidebar-logo h2{font-size:20px;font-weight:700;letter-spacing:2px}
        .nav-item{display:flex;align-items:center;padding:12px 20px;color:#aaa;text-decoration:none;font-size:13px;transition:all 0.2s}
        .nav-item:hover,.nav-item.active{background:rgba(255,255,255,0.05);color:#fff;border-left:3px solid #D4AF37}
        .nav-item i{width:20px;margin-right:12px;text-align:center}
        .main-content{flex:1;margin-left:260px;padding:24px;transition:margin-left 0.3s}
        .main-content.expanded{margin-left:0}
        .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
        .menu-toggle{background:none;border:none;font-size:20px;cursor:pointer;color:#333;padding:8px}
        .btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s}
        .btn-primary{background:#1a1a1a;color:#fff}.btn-primary:hover{background:#000}
        .btn-outline{background:#fff;color:#1a1a1a;border:2px solid #ddd}.btn-outline:hover{border-color:#1a1a1a}
        .btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
        .btn-sm{padding:6px 12px;font-size:11px}
        .table-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .table-card th{background:#fafafa;padding:10px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;border-bottom:1px solid #eee}
        .table-card td{padding:10px 14px;font-size:13px;border-bottom:1px solid #f5f5f5}
        .badge{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600}
        .badge-featured{background:#d4edda;color:#155724}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center}
        .modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
        .modal h3{font-size:18px;font-weight:700;margin-bottom:16px}
        .input-field{width:100%;padding:10px 14px;border:2px solid #e5e5e5;border-radius:8px;font-size:13px;margin-bottom:12px}
        .input-field:focus{outline:none;border-color:#1a1a1a}
        @media(max-width:768px){.sidebar{transform:translateX(-260px)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0}}
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><h2>AARVANA</h2><p>ADMIN PANEL</p></div>
        <nav>
            <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="orders.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="products.html" class="nav-item active"><i class="fas fa-box"></i> Products</a>
            <a href="customers.html" class="nav-item"><i class="fas fa-users"></i> Customers</a>
            <a href="inventory.html" class="nav-item"><i class="fas fa-warehouse"></i> Inventory</a>
            <a href="tracking.html" class="nav-item"><i class="fas fa-truck"></i> Tracking</a>
            <a href="discount.html" class="nav-item"><i class="fas fa-tags"></i> Discounts</a>
            <a href="refund.html" class="nav-item"><i class="fas fa-undo"></i> Refunds</a>
            <a href="analytics.html" class="nav-item"><i class="fas fa-chart-bar"></i> Analytics</a>
            <a href="offers.html" class="nav-item"><i class="fas fa-bullhorn"></i> Offers</a>
            <a href="staff.html" class="nav-item"><i class="fas fa-user-shield"></i> Staff</a>
            <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
            <div style="border-top:1px solid #333;margin:10px 0"></div>
            <a href="#" class="nav-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <button class="btn btn-primary" onclick="openAddProduct()"><i class="fas fa-plus mr-1"></i> Add Product</button>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>SKU</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Sale Price</th>
                        <th>Featured</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTable">
                    <tr><td colspan="8" class="text-center text-gray-400 py-8">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal-overlay" style="display:none">
        <div class="modal">
            <h3 id="modalTitle">Add Product</h3>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="productId">
                <input type="text" id="prodName" class="input-field" placeholder="Product Name *" required>
                <input type="text" id="prodSku" class="input-field" placeholder="SKU (auto-generated if empty)">
                <select id="prodCategory" class="input-field" required>
                    <option value="">Select Category</option>
                    <option value="Men">Men</option>
                    <option value="Women">Women</option>
                    <option value="Accessories">Accessories</option>
                </select>
                <input type="number" id="prodPrice" class="input-field" placeholder="Regular Price *" step="0.01" required>
                <input type="number" id="prodSalePrice" class="input-field" placeholder="Sale Price (optional)" step="0.01">
                <select id="prodBadge" class="input-field">
                    <option value="">No Badge</option>
                    <option value="New">New</option>
                    <option value="Sale">Sale</option>
                    <option value="Premium">Premium</option>
                    <option value="Trending">Trending</option>
                    <option value="Hot">Hot</option>
                    <option value="Limited">Limited</option>
                </select>
                <input type="text" id="prodImage" class="input-field" placeholder="Image URL *" required>
                <textarea id="prodDescription" class="input-field" rows="2" placeholder="Description (optional)"></textarea>
                <label class="flex items-center gap-2 mb-3 text-sm">
                    <input type="checkbox" id="prodFeatured"> Featured Product
                </label>
                <div class="flex gap-2">
                    <button type="submit" class="btn btn-primary flex-1">Save</button>
                    <button type="button" class="btn btn-outline flex-1" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        if (localStorage.getItem('aarvana_admin_logged_in') !== 'true') { window.location.href = 'login.html'; }
        
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); document.getElementById('mainContent').classList.toggle('expanded'); }
        function handleLogout() { localStorage.removeItem('aarvana_admin_logged_in'); window.location.href = 'login.html'; }
        
        var products = [];
        
        function loadProducts() {
            // Load from localStorage first, then JSON
            var stored = localStorage.getItem('aarvana_products');
            if (stored) {
                try { products = JSON.parse(stored); } catch(e) { products = []; }
            }
            if (products.length === 0) {
                fetch('../data/products.json')
                    .then(function(r){return r.json()})
                    .then(function(p){products = p.filter(function(x){return !x.type || x.type !== 'mega_sale'}); renderProducts();})
                    .catch(function(){renderProducts();});
            } else {
                renderProducts();
            }
        }
        
        function renderProducts() {
            var tbody = document.getElementById('productsTable');
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-400 py-8">No products found</td></tr>';
                return;
            }
            var html = '';
            for (var i = 0; i < products.length; i++) {
                var p = products[i];
                var img = (p.images && p.images[0]) ? p.images[0] : 'https://via.placeholder.com/40';
                html += '<tr>' +
                    '<td><img src="'+img+'" alt="'+p.name+'" style="width:40px;height:40px;border-radius:6px;object-fit:cover"></td>' +
                    '<td class="font-medium">'+p.name+'</td>' +
                    '<td class="text-xs text-gray-500">'+(p.sku||p.id||'N/A')+'</td>' +
                    '<td>'+p.category+'</td>' +
                    '<td>$'+p.price.toFixed(2)+'</td>' +
                    '<td>'+(p.salePrice?'<span class="text-red-600">$'+p.salePrice.toFixed(2)+'</span>':'<span class="text-gray-400">-</span>')+'</td>' +
                    '<td>'+(p.isFeatured?'<span class="badge badge-featured">Yes</span>':'<span class="text-gray-400">No</span>')+'</td>' +
                    '<td>' +
                        '<button class="btn btn-outline btn-sm mr-1" onclick="editProduct(\''+p.id+'\')"><i class="fas fa-edit"></i></button>' +
                        '<button class="btn btn-danger btn-sm" onclick="deleteProduct(\''+p.id+'\')"><i class="fas fa-trash"></i></button>' +
                    '</td>' +
                '</tr>';
            }
            tbody.innerHTML = html;
        }
        
        function openAddProduct() {
            document.getElementById('modalTitle').textContent = 'Add Product';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productModal').style.display = 'flex';
        }
        
        function editProduct(id) {
            var p = null;
            for (var i = 0; i < products.length; i++) { if (products[i].id === id) { p = products[i]; break; } }
            if (!p) return;
            document.getElementById('modalTitle').textContent = 'Edit Product';
            document.getElementById('productId').value = p.id;
            document.getElementById('prodName').value = p.name || '';
            document.getElementById('prodSku').value = p.sku || '';
            document.getElementById('prodCategory').value = p.category || '';
            document.getElementById('prodPrice').value = p.price || '';
            document.getElementById('prodSalePrice').value = p.salePrice || '';
            document.getElementById('prodBadge').value = p.badge || '';
            document.getElementById('prodImage').value = (p.images && p.images[0]) ? p.images[0] : '';
            document.getElementById('prodDescription').value = p.description || '';
            document.getElementById('prodFeatured').checked = p.isFeatured || false;
            document.getElementById('productModal').style.display = 'flex';
        }
        
        function closeModal() { document.getElementById('productModal').style.display = 'none'; }
        
        function saveProduct(e) {
            e.preventDefault();
            var id = document.getElementById('productId').value;
            var data = {
                name: document.getElementById('prodName').value,
                sku: document.getElementById('prodSku').value || ('PRD-'+Date.now().toString(36).toUpperCase()),
                category: document.getElementById('prodCategory').value,
                price: parseFloat(document.getElementById('prodPrice').value) || 0,
                salePrice: document.getElementById('prodSalePrice').value ? parseFloat(document.getElementById('prodSalePrice').value) : null,
                badge: document.getElementById('prodBadge').value,
                images: [document.getElementById('prodImage').value],
                description: document.getElementById('prodDescription').value,
                isFeatured: document.getElementById('prodFeatured').checked
            };
            
            if (id) {
                // Update existing
                for (var i = 0; i < products.length; i++) {
                    if (products[i].id === id) {
                        products[i] = Object.assign({}, products[i], data, {id: id, updatedAt: new Date().toISOString()});
                        break;
                    }
                }
            } else {
                // Add new
                data.id = data.sku || ('PRD-'+Date.now().toString(36).toUpperCase());
                data.createdAt = new Date().toISOString();
                products.push(data);
            }
            
            localStorage.setItem('aarvana_products', JSON.stringify(products));
            closeModal();
            renderProducts();
            alert('Product saved successfully!');
        }
        
        function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            products = products.filter(function(p){return p.id !== id});
            localStorage.setItem('aarvana_products', JSON.stringify(products));
            renderProducts();
        }
        
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
