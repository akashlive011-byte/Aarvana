<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Aarvana Admin - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f5f5f5;display:flex;min-height:100vh}
        
        /* Sidebar */
        .sidebar{width:260px;background:#1a1a1a;color:#fff;padding:20px 0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.3s}
        .sidebar.collapsed{transform:translateX(-260px)}
        .sidebar-logo{padding:0 20px 20px;border-bottom:1px solid #333;margin-bottom:20px}
        .sidebar-logo h2{font-size:20px;font-weight:700;letter-spacing:2px}
        .sidebar-logo p{font-size:10px;color:#888;letter-spacing:3px}
        .nav-item{display:flex;align-items:center;padding:12px 20px;color:#aaa;text-decoration:none;font-size:13px;transition:all 0.2s}
        .nav-item:hover,.nav-item.active{background:rgba(255,255,255,0.05);color:#fff;border-left:3px solid #D4AF37}
        .nav-item i{width:20px;margin-right:12px;text-align:center}
        
        /* Main Content */
        .main-content{flex:1;margin-left:260px;padding:24px;transition:margin-left 0.3s}
        .main-content.expanded{margin-left:0}
        
        /* Top Bar */
        .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
        .menu-toggle{background:none;border:none;font-size:20px;cursor:pointer;color:#333;padding:8px}
        .menu-toggle:hover{color:#000}
        
        /* Stats Cards */
        .stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .stat-card .stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
        .stat-card .stat-value{font-size:28px;font-weight:700;color:#1a1a1a}
        .stat-card .stat-label{font-size:12px;color:#888;margin-top:4px}
        
        /* Table */
        .data-table{width:100%;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .data-table th{background:#fafafa;padding:12px 16px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;border-bottom:1px solid #eee}
        .data-table td{padding:12px 16px;font-size:13px;border-bottom:1px solid #f5f5f5}
        .status-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
        .status-confirmed{background:#d4edda;color:#155724}
        .status-pending{background:#fff3cd;color:#856404}
        
        @media(max-width:768px){
            .sidebar{transform:translateX(-260px)}
            .sidebar.open{transform:translateX(0)}
            .main-content{margin-left:0}
        }
    </style>
</head>
<body>

    <!-- ============================================
    SIDEBAR
    ============================================ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <h2>AARVANA</h2>
            <p>ADMIN PANEL</p>
        </div>
        <nav>
            <a href="dashboard.html" class="nav-item active"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="orders.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="products.html" class="nav-item"><i class="fas fa-box"></i> Products</a>
            <a href="customers.html" class="nav-item"><i class="fas fa-users"></i> Customers</a>
            <a href="inventory.html" class="nav-item"><i class="fas fa-warehouse"></i> Inventory</a>
            <a href="tracking.html" class="nav-item"><i class="fas fa-truck"></i> Tracking</a>
            <a href="discount.html" class="nav-item"><i class="fas fa-tags"></i> Discounts</a>
            <a href="refund.html" class="nav-item"><i class="fas fa-undo"></i> Refunds</a>
            <a href="analytics.html" class="nav-item"><i class="fas fa-chart-bar"></i> Analytics</a>
            <a href="offers.html" class="nav-item"><i class="fas fa-bullhorn"></i> Offers</a>
            <a href="staff.html" class="nav-item"><i class="fas fa-user-shield"></i> Staff</a>
            <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
            <div style="border-top:1px solid #333;margin:10px 0"></div>
            <a href="#" class="nav-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <!-- ============================================
    MAIN CONTENT
    ============================================ -->
    <main class="main-content" id="mainContent">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-500" id="adminUser"></span>
                <a href="../index.html" target="_blank" class="text-sm text-gray-500 hover:text-gray-800"><i class="fas fa-external-link-alt mr-1"></i> View Site</a>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="stat-card">
                <div class="stat-icon" style="background:#e8f5e9;color:#2e7d32"><i class="fas fa-shopping-cart"></i></div>
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#e3f2fd;color:#1565c0"><i class="fas fa-dollar-sign"></i></div>
                <div class="stat-value" id="totalRevenue">$0</div>
                <div class="stat-label">Total Revenue</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#fce4ec;color:#c62828"><i class="fas fa-box"></i></div>
                <div class="stat-value" id="totalProducts">0</div>
                <div class="stat-label">Products</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#fff3e0;color:#e65100"><i class="fas fa-users"></i></div>
                <div class="stat-value" id="totalCustomers">0</div>
                <div class="stat-label">Customers</div>
            </div>
        </div>

        <!-- Recent Orders -->
        <div class="data-table">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="recentOrders">
                    <tr><td colspan="6" class="text-center text-gray-400 py-8">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/admin.js"></script>
    <script>
        // Check authentication
        if (localStorage.getItem('aarvana_admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }
        document.getElementById('adminUser').textContent = localStorage.getItem('aarvana_admin_user') || 'Admin';
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.getElementById('mainContent').classList.toggle('expanded');
        }
        
        function handleLogout() {
            localStorage.removeItem('aarvana_admin_logged_in');
            localStorage.removeItem('aarvana_admin_user');
            window.location.href = 'login.html';
        }
        
        // Load dashboard stats
        function loadDashboard() {
            var orders = JSON.parse(localStorage.getItem('aarvana_orders') || '[]');
            var products = JSON.parse(localStorage.getItem('aarvana_products') || '[]');
            // Also check for JSON products
            if (products.length === 0) {
                fetch('../data/products.json')
                    .then(function(r){return r.json()})
                    .then(function(p){products = p.filter(function(x){return !x.type || x.type !== 'mega_sale'})})
                    .catch(function(){});
            }
            
            document.getElementById('totalOrders').textContent = orders.length;
            var revenue = 0;
            for (var i = 0; i < orders.length; i++) { revenue += orders[i].total || 0; }
            document.getElementById('totalRevenue').textContent = '$' + revenue.toFixed(2);
            document.getElementById('totalProducts').textContent = products.length || 8;
            
            var uniqueCustomers = [];
            for (var i = 0; i < orders.length; i++) {
                if (orders[i].customer && orders[i].customer.phone) {
                    if (uniqueCustomers.indexOf(orders[i].customer.phone) === -1) {
                        uniqueCustomers.push(orders[i].customer.phone);
                    }
                }
            }
            document.getElementById('totalCustomers').textContent = uniqueCustomers.length;
            
            // Recent orders
            var recentOrders = orders.slice(0, 5);
            var tbody = document.getElementById('recentOrders');
            if (recentOrders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-gray-400 py-8">No orders yet</td></tr>';
            } else {
                var html = '';
                for (var i = 0; i < recentOrders.length; i++) {
                    var o = recentOrders[i];
                    html += '<tr>' +
                        '<td class="font-medium">' + o.orderNumber + '</td>' +
                        '<td>' + (o.customer ? o.customer.name : 'N/A') + '</td>' +
                        '<td>$' + (o.total || 0).toFixed(2) + '</td>' +
                        '<td>' + (o.payment ? o.payment.method.toUpperCase() : 'N/A') + '</td>' +
                        '<td><span class="status-badge status-confirmed">' + (o.status || 'Confirmed') + '</span></td>' +
                        '<td class="text-gray-500">' + new Date(o.date).toLocaleDateString() + '</td>' +
                    '</tr>';
                }
                tbody.innerHTML = html;
            }
        }
        
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
