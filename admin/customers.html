<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Aarvana Admin - Customers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f5f5f5;display:flex;min-height:100vh}
        
        /* Sidebar */
        .sidebar{width:260px;background:#1a1a1a;color:#fff;padding:20px 0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.3s}
        .sidebar.collapsed{transform:translateX(-260px)}
        .sidebar-logo{padding:0 20px 20px;border-bottom:1px solid #333;margin-bottom:20px}
        .sidebar-logo h2{font-size:20px;font-weight:700;letter-spacing:2px}
        .nav-item{display:flex;align-items:center;padding:12px 20px;color:#aaa;text-decoration:none;font-size:13px;transition:all 0.2s}
        .nav-item:hover,.nav-item.active{background:rgba(255,255,255,0.05);color:#fff;border-left:3px solid #D4AF37}
        .nav-item i{width:20px;margin-right:12px;text-align:center}
        
        /* Main Content */
        .main-content{flex:1;margin-left:260px;padding:24px;transition:margin-left 0.3s}
        .main-content.expanded{margin-left:0}
        .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
        .menu-toggle{background:none;border:none;font-size:20px;cursor:pointer;color:#333;padding:8px}
        
        /* Stats Cards */
        .stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .stat-value{font-size:28px;font-weight:700;color:#1a1a1a}
        .stat-label{font-size:12px;color:#888;margin-top:4px}
        
        /* Table */
        .table-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
        .table-card th{background:#fafafa;padding:10px 14px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;border-bottom:1px solid #eee}
        .table-card td{padding:10px 14px;font-size:13px;border-bottom:1px solid #f5f5f5}
        
        /* Modal */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center}
        .modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto}
        
        @media(max-width:768px){.sidebar{transform:translateX(-260px)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0}}
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><h2>AARVANA</h2><p>ADMIN PANEL</p></div>
        <nav>
            <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="orders.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="products.html" class="nav-item"><i class="fas fa-box"></i> Products</a>
            <a href="customers.html" class="nav-item active"><i class="fas fa-users"></i> Customers</a>
            <a href="inventory.html" class="nav-item"><i class="fas fa-warehouse"></i> Inventory</a>
            <a href="tracking.html" class="nav-item"><i class="fas fa-truck"></i> Tracking</a>
            <a href="discount.html" class="nav-item"><i class="fas fa-tags"></i> Discounts</a>
            <a href="refund.html" class="nav-item"><i class="fas fa-undo"></i> Refunds</a>
            <a href="analytics.html" class="nav-item"><i class="fas fa-chart-bar"></i> Analytics</a>
            <a href="offers.html" class="nav-item"><i class="fas fa-bullhorn"></i> Offers</a>
            <a href="staff.html" class="nav-item"><i class="fas fa-user-shield"></i> Staff</a>
            <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
            <div style="border-top:1px solid #333;margin:10px 0"></div>
            <a href="#" class="nav-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h2 class="text-xl font-bold">Customers</h2>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="stat-card">
                <div class="stat-value" id="totalCustomers">0</div>
                <div class="stat-label">Total Customers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgOrder">$0</div>
                <div class="stat-label">Avg. Order Value</div>
            </div>
        </div>

        <!-- Search -->
        <div class="mb-4">
            <input type="text" id="customerSearch" class="input-field" placeholder="Search by name, phone, or email..." oninput="filterCustomers()" style="max-width:400px;padding:10px 14px;border:2px solid #e5e5e5;border-radius:8px;font-size:13px;width:100%">
        </div>

        <!-- Customers Table -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Orders</th>
                        <th>Total Spent</th>
                        <th>Last Order</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="customersTable">
                    <tr><td colspan="8" class="text-center text-gray-400 py-8">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Customer Detail Modal -->
    <div id="customerModal" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Customer Details</h3>
                <button onclick="closeCustomerModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            <div id="customerDetail"></div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('aarvana_admin_logged_in') !== 'true') { window.location.href = 'login.html'; }
        
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); document.getElementById('mainContent').classList.toggle('expanded'); }
        function handleLogout() { localStorage.removeItem('aarvana_admin_logged_in'); window.location.href = 'login.html'; }
        
        var allCustomers = [];
        var filteredCustomers = [];
        
        function loadCustomers() {
            var orders = JSON.parse(localStorage.getItem('aarvana_orders') || '[]');
            var customerMap = {};
            
            // Group orders by phone number (unique identifier)
            for (var i = 0; i < orders.length; i++) {
                var order = orders[i];
                if (!order.customer || !order.customer.phone) continue;
                
                var phone = order.customer.phone;
                if (!customerMap[phone]) {
                    customerMap[phone] = {
                        name: order.customer.name || 'Unknown',
                        phone: phone,
                        email: order.customer.email || 'N/A',
                        orders: [],
                        totalSpent: 0,
                        lastOrder: order.date,
                        division: order.customer.division || '',
                        district: order.customer.district || '',
                        address: order.customer.address || ''
                    };
                }
                customerMap[phone].orders.push(order);
                customerMap[phone].totalSpent += order.total || 0;
                if (new Date(order.date) > new Date(customerMap[phone].lastOrder)) {
                    customerMap[phone].lastOrder = order.date;
                }
            }
            
            // Convert to array
            allCustomers = [];
            for (var key in customerMap) {
                if (customerMap.hasOwnProperty(key)) {
                    allCustomers.push(customerMap[key]);
                }
            }
            
            // Sort by last order date (newest first)
            allCustomers.sort(function(a, b) {
                return new Date(b.lastOrder) - new Date(a.lastOrder);
            });
            
            filteredCustomers = allCustomers.slice();
            
            // Update stats
            document.getElementById('totalCustomers').textContent = allCustomers.length;
            document.getElementById('totalOrders').textContent = orders.length;
            
            var totalRevenue = 0;
            for (var i = 0; i < allCustomers.length; i++) {
                totalRevenue += allCustomers[i].totalSpent;
            }
            var avg = allCustomers.length > 0 ? (totalRevenue / allCustomers.length).toFixed(2) : '0.00';
            document.getElementById('avgOrder').textContent = '$' + avg;
            
            renderCustomers();
        }
        
        function renderCustomers() {
            var tbody = document.getElementById('customersTable');
            if (filteredCustomers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-400 py-8">No customers found</td></tr>';
                return;
            }
            var html = '';
            for (var i = 0; i < filteredCustomers.length; i++) {
                var c = filteredCustomers[i];
                html += '<tr>' +
                    '<td class="text-gray-400">' + (i + 1) + '</td>' +
                    '<td class="font-medium">' + c.name + '</td>' +
                    '<td>' + c.phone + '</td>' +
                    '<td class="text-gray-500">' + c.email + '</td>' +
                    '<td>' + c.orders.length + '</td>' +
                    '<td class="font-semibold">$' + c.totalSpent.toFixed(2) + '</td>' +
                    '<td class="text-gray-500 text-xs">' + new Date(c.lastOrder).toLocaleDateString() + '</td>' +
                    '<td><button onclick="viewCustomer(\'' + c.phone + '\')" class="text-blue-600 hover:underline text-xs">View</button></td>' +
                '</tr>';
            }
            tbody.innerHTML = html;
        }
        
        function filterCustomers() {
            var query = document.getElementById('customerSearch').value.toLowerCase().trim();
            if (!query) {
                filteredCustomers = allCustomers.slice();
            } else {
                filteredCustomers = allCustomers.filter(function(c) {
                    return (c.name && c.name.toLowerCase().indexOf(query) !== -1) ||
                           (c.phone && c.phone.indexOf(query) !== -1) ||
                           (c.email && c.email.toLowerCase().indexOf(query) !== -1);
                });
            }
            renderCustomers();
        }
        
        function viewCustomer(phone) {
            var c = null;
            for (var i = 0; i < allCustomers.length; i++) {
                if (allCustomers[i].phone === phone) { c = allCustomers[i]; break; }
            }
            if (!c) return;
            
            var html = '<div class="space-y-4">' +
                '<div><strong>Name:</strong> ' + c.name + '</div>' +
                '<div><strong>Phone:</strong> ' + c.phone + '</div>' +
                '<div><strong>Email:</strong> ' + c.email + '</div>' +
                '<div><strong>Division:</strong> ' + (c.division || 'N/A') + '</div>' +
                '<div><strong>District:</strong> ' + (c.district || 'N/A') + '</div>' +
                '<div><strong>Address:</strong> ' + (c.address || 'N/A') + '</div>' +
                '<div><strong>Total Orders:</strong> ' + c.orders.length + '</div>' +
                '<div><strong>Total Spent:</strong> $' + c.totalSpent.toFixed(2) + '</div>' +
                '<div><strong>Last Order:</strong> ' + new Date(c.lastOrder).toLocaleDateString() + '</div>' +
                '<div class="border-t pt-3 mt-3"><strong>Order History:</strong></div>';
            
            for (var j = 0; j < c.orders.length; j++) {
                var o = c.orders[j];
                html += '<div class="flex justify-between text-sm py-2 border-b">' +
                    '<span>' + o.orderNumber + '</span>' +
                    '<span>' + new Date(o.date).toLocaleDateString() + '</span>' +
                    '<span class="font-semibold">$' + (o.total || 0).toFixed(2) + '</span>' +
                    '<span class="text-xs text-gray-500">' + (o.status || 'Confirmed') + '</span>' +
                '</div>';
            }
            html += '</div>';
            
            document.getElementById('customerDetail').innerHTML = html;
            document.getElementById('customerModal').style.display = 'flex';
        }
        
        function closeCustomerModal() {
            document.getElementById('customerModal').style.display = 'none';
        }
        
        document.addEventListener('DOMContentLoaded', loadCustomers);
    </script>
</body>
</html>
